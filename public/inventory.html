<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory — ShopFlow</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/"><span class="brand-mark">SF</span> ShopFlow</a>
    <nav class="nav">
      <a href="/">Dashboard</a>
      <a href="/materials.html">Materials</a>
      <a href="/routings.html">Routings</a>
      <a href="/work-orders.html">Work Orders</a>
      <a href="/shop">Shop Floor</a>
      <a href="/inventory.html">Inventory</a>
    </nav>
  </header>
  <main>
    <h1>Inventory</h1>
    <p class="subtitle">On-hand balances and issue / receipt / adjust movements.</p>

    <div class="grid-2">
      <section class="card">
        <h2>Quick movement</h2>
        <div class="form-grid">
          <label>Material
            <select id="m-mat"></select>
          </label>
          <label>Type
            <select id="m-type">
              <option value="issue">Issue (out)</option>
              <option value="receipt">Receipt (in)</option>
              <option value="adjust">Adjust (+/−)</option>
            </select>
          </label>
          <label>Qty <input id="m-qty" type="number" step="any" /></label>
          <label>Note <input id="m-note" placeholder="Optional" /></label>
        </div>
        <button class="primary" id="btn-move">Post movement</button>
      </section>
      <section class="card flat">
        <div style="padding:0.85rem 1rem 0"><h2>On hand</h2></div>
        <table>
          <thead><tr><th>SKU</th><th>Name</th><th>Unit</th><th class="right">Qty</th></tr></thead>
          <tbody id="onhand"></tbody>
        </table>
      </section>
    </div>

    <div style="height:1rem"></div>
    <section class="card flat">
      <div style="padding:0.85rem 1rem 0"><h2>Movement history</h2></div>
      <table>
        <thead>
          <tr><th>When</th><th>SKU</th><th>Type</th><th class="right">Qty</th><th>WO</th><th>Note</th></tr>
        </thead>
        <tbody id="moves"></tbody>
      </table>
    </section>
  </main>
  <script src="/js/app.js"></script>
  <script>
    async function load() {
      const mats = await ShopFlow.api('/api/materials');
      document.getElementById('m-mat').innerHTML = mats.map(m =>
        `<option value="${m.id}">${ShopFlow.escape(m.sku)} (${m.on_hand})</option>`).join('');
      document.getElementById('onhand').innerHTML = mats.map(m => `
        <tr>
          <td class="mono">${ShopFlow.escape(m.sku)}</td>
          <td>${ShopFlow.escape(m.name)}</td>
          <td>${ShopFlow.escape(m.unit)}</td>
          <td class="right">${m.on_hand}</td>
        </tr>`).join('');

      const moves = await ShopFlow.api('/api/inventory/movements?limit=50');
      document.getElementById('moves').innerHTML = moves.length ? moves.map(m => `
        <tr>
          <td class="muted">${ShopFlow.escape((m.created_at||'').replace('T',' ').slice(0,19))}</td>
          <td class="mono">${ShopFlow.escape(m.sku)}</td>
          <td>${ShopFlow.escape(m.movement_type)}</td>
          <td class="right">${m.qty}</td>
          <td class="mono">${ShopFlow.escape(m.wo_number || '—')}</td>
          <td class="muted">${ShopFlow.escape(m.note || '')}</td>
        </tr>`).join('') : '<tr><td colspan="6" class="empty">No movements yet — complete a WO or post one above</td></tr>';
    }

    document.getElementById('btn-move').onclick = async () => {
      try {
        const type = document.getElementById('m-type').value;
        const body = {
          material_id: Number(document.getElementById('m-mat').value),
          qty: Number(document.getElementById('m-qty').value),
          note: document.getElementById('m-note').value || undefined,
        };
        await ShopFlow.api(`/api/inventory/${type}`, { method: 'POST', body });
        ShopFlow.toast('Movement posted');
        document.getElementById('m-qty').value = '';
        load();
      } catch (e) { ShopFlow.toast(e.message, 'error'); }
    };

    load().catch(e => ShopFlow.toast(e.message, 'error'));
  </script>
</body>
</html>

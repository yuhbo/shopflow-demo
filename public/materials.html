<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="title.materials">物料 — ShopFlow</title>
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    try {
      var lang = localStorage.getItem('shopflow_lang');
      if (lang === 'en') {
        document.documentElement.lang = 'en';
        document.documentElement.dataset.lang = 'en';
      }
    } catch (e) {}
  </script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/"><span class="brand-mark">SF</span> ShopFlow</a>
    <nav class="nav">
      <a href="/" data-i18n="nav.dashboard">总览</a>
      <a href="/materials.html" data-i18n="nav.materials">物料</a>
      <a href="/routings.html" data-i18n="nav.routings">工艺路线</a>
      <a href="/work-orders.html" data-i18n="nav.workOrders">工单</a>
      <a href="/shop" data-i18n="nav.shop">车间</a>
      <a href="/inventory.html" data-i18n="nav.inventory">库存</a>
    </nav>
    <div class="header-tools">
      <div class="header-meta" data-i18n="header.meta">演示工厂 · 单站点</div>
      <div class="lang-toggle" role="group" data-i18n-aria="lang.aria" aria-label="语言">
        <button type="button" data-set-lang="zh" aria-pressed="true">中文</button>
        <button type="button" data-set-lang="en" aria-pressed="false">English</button>
      </div>
    </div>
  </header>
  <main>
    <h1 data-i18n="mat.title">物料</h1>
    <p class="subtitle" data-i18n="mat.subtitle">主数据：编码、名称、单位和现存量。</p>
    <div class="toolbar">
      <button class="primary" id="btn-new" data-i18n="mat.new">+ 新建物料</button>
    </div>
    <section class="card flat">
      <table>
        <thead>
          <tr>
            <th data-i18n="mat.col.sku">编码</th>
            <th data-i18n="mat.col.name">名称</th>
            <th data-i18n="mat.col.unit">单位</th>
            <th class="right" data-i18n="mat.col.onHand">现存量</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>

  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <h2 data-i18n="mat.modalTitle">新建物料</h2>
      <div class="form-grid">
        <label><span data-i18n="mat.sku">编码</span> <input id="f-sku" data-i18n-placeholder="mat.ph.sku" placeholder="FG-WIDGET" /></label>
        <label><span data-i18n="mat.unit">单位</span> <input id="f-unit" data-i18n-value="mat.defaultUnit" value="件" /></label>
        <label style="grid-column:1/-1"><span data-i18n="mat.name">名称</span> <input id="f-name" data-i18n-placeholder="mat.ph.name" placeholder="支架总成" /></label>
        <label><span data-i18n="mat.onHand">现存量</span> <input id="f-qty" type="number" step="any" value="0" /></label>
      </div>
      <div class="modal-actions">
        <button class="ghost" id="btn-cancel" data-i18n="common.cancel">取消</button>
        <button class="primary" id="btn-save" data-i18n="common.save">保存</button>
      </div>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script>
    const modal = document.getElementById('modal');
    async function load() {
      const rows = await ShopFlow.api('/api/materials');
      document.getElementById('rows').innerHTML = rows.map(m => `
        <tr>
          <td class="mono">${ShopFlow.escape(m.sku)}</td>
          <td>${ShopFlow.escape(ShopFlow.materialName(m.sku, m.name))}</td>
          <td>${ShopFlow.escape(ShopFlow.unit(m.unit))}</td>
          <td class="right">${m.on_hand}</td>
        </tr>`).join('');
    }
    document.getElementById('btn-new').onclick = () => modal.classList.add('show');
    document.getElementById('btn-cancel').onclick = () => modal.classList.remove('show');
    document.getElementById('btn-save').onclick = async () => {
      try {
        await ShopFlow.api('/api/materials', {
          method: 'POST',
          body: {
            sku: document.getElementById('f-sku').value,
            name: document.getElementById('f-name').value,
            unit: document.getElementById('f-unit').value,
            on_hand: Number(document.getElementById('f-qty').value) || 0,
          },
        });
        modal.classList.remove('show');
        ShopFlow.toast(ShopFlow.t('mat.toast.created'));
        load();
      } catch (e) { ShopFlow.toast(e.message, 'error'); }
    };
    ShopFlow.onLang(() => load());
    load().catch(e => ShopFlow.toast(e.message, 'error'));
  </script>
</body>
</html>
